<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta name="theme-color" content="#171946">

<title>For Your 23</title>

<style>

/* =========================================================
   BASE
========================================================= */

:root {
  --ui:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    system-ui,
    sans-serif;

  --hand:
    "STKaiti",
    "Kaiti SC",
    "KaiTi",
    "楷体",
    "DFKai-SB",
    cursive,
    serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--ui);

  color: #fff;
  background: #0f1437;

  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
}

button,
#story {
  touch-action: manipulation;
}


/* =========================================================
   APP / 星空底色
========================================================= */

#app {
  position: relative;

  width: 100%;
  height: 100vh;
  height: 100svh;

  overflow: hidden;
  isolation: isolate;

  background:
    radial-gradient(
      circle at 11% 15%,
      rgba(82,136,255,.96),
      transparent 29%
    ),

    radial-gradient(
      circle at 86% 16%,
      rgba(194,89,255,.85),
      transparent 31%
    ),

    radial-gradient(
      circle at 50% 86%,
      rgba(54,214,255,.66),
      transparent 39%
    ),

    radial-gradient(
      circle at 50% 44%,
      rgba(255,255,255,.07),
      transparent 24%
    ),

    linear-gradient(
      145deg,
      #10163c 0%,
      #202259 34%,
      #462474 67%,
      #153f75 100%
    );
}


/* =========================================================
   星云
========================================================= */

.nebula {
  position: absolute;
  z-index: 1;

  border-radius: 50%;

  pointer-events: none;

  filter: blur(100px);

  mix-blend-mode: screen;

  animation:
    nebulaFloat
    12s
    ease-in-out
    infinite
    alternate;
}

.nebula.a {
  width: 48vw;
  height: 48vw;

  left: -14vw;
  top: 6vh;

  background:
    rgba(107,153,255,.48);
}

.nebula.b {
  width: 44vw;
  height: 44vw;

  right: -13vw;
  top: -12vh;

  background:
    rgba(208,102,255,.40);

  animation-delay: -4s;
}

.nebula.c {
  width: 40vw;
  height: 40vw;

  left: 32vw;
  bottom: -19vh;

  background:
    rgba(58,224,255,.33);

  animation-delay: -8s;
}

@keyframes nebulaFloat {
  from {
    transform:
      translate3d(-2%,0,0)
      scale(.92);
  }

  to {
    transform:
      translate3d(10%,8%,0)
      scale(1.17);
  }
}


/* =========================================================
   GRID
========================================================= */

.mesh {
  position: absolute;
  inset: 0;

  z-index: 2;

  opacity: .05;

  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(255,255,255,.40) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.40) 1px,
      transparent 1px
    );

  background-size: 46px 46px;

  mask-image:
    radial-gradient(
      circle at center,
      black 0%,
      transparent 79%
    );
}


/* =========================================================
   CANVAS
========================================================= */

#constellationCanvas,
#fxCanvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;
}

#constellationCanvas {
  z-index: 5;

  mix-blend-mode: screen;
}

#fxCanvas {
  z-index: 35;
}


/* =========================================================
   暗角
========================================================= */

.vignette {
  position: absolute;
  inset: 0;

  z-index: 7;

  pointer-events: none;

  background:
    radial-gradient(
      circle at center,
      transparent 24%,
      rgba(4,7,29,.08) 62%,
      rgba(3,5,22,.44) 100%
    );
}


/* =========================================================
   点击爆闪
========================================================= */

#flash {
  position: absolute;
  inset: 0;

  z-index: 34;

  opacity: 0;

  pointer-events: none;

  background:
    radial-gradient(
      circle at
      var(--flash-x,50%)
      var(--flash-y,50%),

      rgba(255,255,255,.96) 0%,
      rgba(193,215,255,.67) 6%,
      rgba(155,125,255,.27) 19%,
      transparent 49%
    );
}

#flash.boom {
  animation:
    flashBoom
    .72s
    ease-out;
}

@keyframes flashBoom {
  0% {
    opacity: 0;
  }

  9% {
    opacity: .92;
  }

  28% {
    opacity: .42;
  }

  100% {
    opacity: 0;
  }
}


/* =========================================================
   INTRO
========================================================= */

#intro {
  position: absolute;
  inset: 0;

  z-index: 100;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 30px;

  background:
    radial-gradient(
      circle at center,
      rgba(100,104,205,.07),
      rgba(7,10,38,.18)
    );

  backdrop-filter: blur(2px);

  transition:
    opacity .85s ease,
    transform .85s ease;
}

#intro.leave {
  opacity: 0;

  transform:
    scale(1.08);

  pointer-events: none;
}

.intro-title {
  margin-bottom: 30px;

  font-family: var(--ui);

  font-size: 11px;

  letter-spacing: .48em;

  color:
    rgba(255,255,255,.65);
}


/* =========================================================
   玻璃信封
========================================================= */

#envelope {
  position: relative;

  width: 310px;
  height: 202px;

  max-width: 82vw;

  border: 0;
  outline: 0;

  cursor: pointer;

  background: transparent;

  perspective: 1100px;

  filter:
    drop-shadow(
      0 30px 42px
      rgba(7,11,42,.30)
    );

  transition:
    transform .3s ease;
}

#envelope:hover {
  transform:
    translateY(-5px)
    rotate(-1deg)
    scale(1.02);
}

#envelope:active {
  transform:
    scale(.97);
}


.env-back {
  position: absolute;
  inset: 0;

  border-radius: 24px;

  border:
    1px solid
    rgba(255,255,255,.27);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.090),
      rgba(255,255,255,.016)
    );

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.18),

    inset 0 -1px 0
    rgba(125,151,255,.08),

    0 0 75px
    rgba(133,115,255,.13);

  backdrop-filter:
    blur(10px)
    saturate(120%);
}


.env-letter {
  position: absolute;

  left: 50%;
  top: 30px;

  width: 226px;
  height: 130px;

  transform:
    translateX(-50%);

  border-radius: 16px;

  border:
    1px solid
    rgba(255,255,255,.23);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.008)
    );

  backdrop-filter:
    blur(7px);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.15),

    0 12px 36px
    rgba(15,20,68,.14);

  transition:
    transform 1s
    cubic-bezier(.16,.90,.23,1);
}


.env-front {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 62%;

  border-radius:
    0 0 24px 24px;

  border:
    1px solid
    rgba(255,255,255,.19);

  border-top: 0;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.070),
      rgba(255,255,255,.010)
    );

  backdrop-filter:
    blur(8px);

  clip-path:
    polygon(
      0 0,
      50% 72%,
      100% 0,
      100% 100%,
      0 100%
    );
}


.env-flap {
  position: absolute;
  inset: 0;

  transform-origin:
    top center;

  clip-path:
    polygon(
      0 0,
      50% 61%,
      100% 0,
      100% 73%,
      0 73%
    );

  border-radius:
    24px 24px 0 0;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.080),
      rgba(255,255,255,.012)
    );

  border-top:
    1px solid
    rgba(255,255,255,.24);

  backdrop-filter:
    blur(8px);

  transition:
    transform .95s
    cubic-bezier(.18,.86,.24,1),

    opacity .6s ease;
}


.env-line {
  position: absolute;

  z-index: 4;

  width: 1px;

  pointer-events: none;

  background:
    rgba(255,255,255,.22);

  box-shadow:
    0 0 9px
    rgba(148,177,255,.15);
}

.env-line.left {
  height: 128px;

  left: 78px;
  bottom: 5px;

  transform:
    rotate(-51deg);

  transform-origin:
    bottom;
}

.env-line.right {
  height: 128px;

  right: 78px;
  bottom: 5px;

  transform:
    rotate(51deg);

  transform-origin:
    bottom;
}


#envelope.open .env-flap {
  transform:
    rotateX(180deg);

  opacity: .12;
}

#envelope.open .env-letter {
  transform:
    translate(-50%,-82px)
    scale(1.08);
}


.intro-hint {
  margin-top: 31px;

  font-family: var(--ui);

  font-size: 12px;

  letter-spacing: .12em;

  color:
    rgba(255,255,255,.60);

  animation:
    breathe
    1.8s
    ease-in-out
    infinite;
}

@keyframes breathe {
  0%,
  100% {
    opacity: .38;
  }

  50% {
    opacity: .95;
  }
}


/* =========================================================
   STORY
========================================================= */

#story {
  position: absolute;
  inset: 0;

  z-index: 20;

  display: flex;

  align-items: center;
  justify-content: center;

  padding:
    68px
    28px
    145px;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 1s ease;
}

#story.show {
  opacity: 1;

  pointer-events: auto;
}


/* =========================================================
   GLASS LETTER
========================================================= */

#letterCard {
  position: relative;

  width:
    min(
      790px,
      84vw
    );

  min-height:
    clamp(
      350px,
      53vh,
      500px
    );

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding:
    64px
    68px
    54px;

  overflow: hidden;

  border-radius: 32px;

  border:
    1px solid
    rgba(255,255,255,.19);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.043),
      rgba(255,255,255,.005)
    );

  backdrop-filter:
    blur(7px)
    saturate(118%);

  -webkit-backdrop-filter:
    blur(7px)
    saturate(118%);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.16),

    inset 0 -1px 0
    rgba(119,157,255,.045),

    0 28px 90px
    rgba(5,11,54,.15),

    0 0 100px
    rgba(126,112,255,.045);

  cursor: pointer;

  user-select: none;

  transition:
    transform .45s ease,
    opacity .45s ease,
    filter .45s ease;
}


#letterCard::before {
  content: "";

  position: absolute;

  inset: 12px;

  border-radius: 23px;

  border:
    1px solid
    rgba(255,255,255,.055);

  pointer-events: none;
}


#letterCard::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -20%;

  width: 1px;
  height: 140%;

  opacity: .075;

  pointer-events: none;

  background:
    linear-gradient(
      transparent,
      rgba(255,255,255,.78),
      transparent
    );

  transform:
    rotate(37deg);
}


/* =========================================================
   GLASS CORNERS
========================================================= */

.glass-corner {
  position: absolute;

  width: 42px;
  height: 42px;

  opacity: .34;

  pointer-events: none;
}

.glass-corner::before,
.glass-corner::after {
  content: "";

  position: absolute;

  background:
    rgba(255,255,255,.36);

  box-shadow:
    0 0 10px
    rgba(129,178,255,.13);
}

.glass-corner::before {
  width: 27px;
  height: 1px;
}

.glass-corner::after {
  width: 1px;
  height: 27px;
}

.glass-corner.tl {
  left: 24px;
  top: 24px;
}

.glass-corner.tr {
  right: 24px;
  top: 24px;

  transform:
    rotate(90deg);
}

.glass-corner.bl {
  left: 24px;
  bottom: 24px;

  transform:
    rotate(-90deg);
}

.glass-corner.br {
  right: 24px;
  bottom: 24px;

  transform:
    rotate(180deg);
}


/* =========================================================
   TEXT
========================================================= */

#eyebrow {
  position: relative;

  z-index: 4;

  margin-bottom: 27px;

  font-family: var(--ui);

  font-size: 10px;

  font-weight: 400;

  letter-spacing: .48em;

  text-transform: uppercase;

  color:
    rgba(235,241,255,.55);

  transition:
    opacity .3s ease;
}


#storyText {
  position: relative;

  z-index: 4;

  width: 100%;
  min-height: 190px;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;
  text-wrap: balance;

  color:
    rgba(255,255,255,.94);
}


/*
  手写正文

  保留之前更舒服的字号 / 行距 / 字距。
*/

.story-line {
  display: block;

  opacity: 0;

  transform:
    translateY(18px);

  filter:
    blur(8px);

  font-family:
    var(--hand);

  font-size:
    clamp(
      20px,
      2.45vw,
      31px
    );

  line-height: 1.95;

  font-weight: 400;

  letter-spacing: .025em;

  text-shadow:
    0 0 18px
    rgba(255,255,255,.09),

    0 0 48px
    rgba(145,128,255,.16);

  animation:
    lineIn
    .82s
    cubic-bezier(.18,.88,.23,1)
    forwards;

  animation-delay:
    calc(
      var(--i) * 165ms
    );
}


/* 第一页 23 */

#letterCard[data-mode="hero"]
.story-line {
  font-size:
    clamp(
      76px,
      13vw,
      150px
    );

  line-height: 1;

  font-weight: 300;

  letter-spacing: .08em;

  text-shadow:
    0 0 35px
    rgba(255,255,255,.25),

    0 0 100px
    rgba(142,115,255,.38);
}


/* 日期页 */

#letterCard[data-mode="date"]
.story-line:first-child {
  margin-bottom: 17px;

  font-size:
    clamp(
      43px,
      7vw,
      74px
    );

  line-height: 1.15;

  font-weight: 300;

  letter-spacing: .12em;
}


/* 安静页 */

#letterCard[data-mode="quiet"]
.story-line {
  font-weight: 400;

  letter-spacing: .03em;
}


@keyframes lineIn {
  0% {
    opacity: 0;

    transform:
      translateY(20px)
      scale(.97);

    filter:
      blur(11px);
  }

  65% {
    opacity: .95;

    filter:
      blur(2px);
  }

  100% {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);

    filter:
      blur(0);
  }
}


#letterCard.leaving {
  opacity: 0;

  filter:
    blur(11px);

  transform:
    translateY(-14px)
    scale(1.025);
}


#letterCard.shatter {
  opacity: 0;

  filter:
    blur(15px);

  transform:
    scale(1.10)
    rotate(.7deg);
}


#continueHint {
  position: absolute;

  z-index: 4;

  bottom: 30px;

  left: 50%;

  transform:
    translateX(-50%);

  white-space: nowrap;

  font-family: var(--ui);

  font-size: 10px;

  letter-spacing: .14em;

  color:
    rgba(235,240,255,.39);

  animation:
    breathe
    1.9s
    ease-in-out
    infinite;
}


/* =========================================================
   GLASS RIPPLE
========================================================= */

#glassRipple {
  position: absolute;

  z-index: 2;

  width: 20px;
  height: 20px;

  border-radius: 50%;

  pointer-events: none;

  opacity: 0;

  border:
    1px solid
    rgba(255,255,255,.62);

  box-shadow:
    0 0 25px
    rgba(116,188,255,.26);
}

#glassRipple.go {
  animation:
    glassRipple
    .9s
    ease-out;
}

@keyframes glassRipple {
  0% {
    opacity: .7;

    transform:
      translate(-50%,-50%)
      scale(.2);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%,-50%)
      scale(24);
  }
}


/* =========================================================
   RINGS
========================================================= */

.ring {
  position: absolute;

  z-index: 1;

  left: 50%;
  top: 50%;

  width:
    min(
      470px,
      62vw
    );

  aspect-ratio: 1;

  border-radius: 50%;

  border:
    1px solid
    rgba(185,195,255,.16);

  opacity: 0;

  pointer-events: none;

  transform:
    translate(-50%,-50%)
    scale(.25);
}

.ring.second {
  width:
    min(
      620px,
      76vw
    );

  border-style: dashed;

  border-color:
    rgba(97,218,255,.14);
}

.ring.third {
  width:
    min(
      335px,
      46vw
    );

  border-color:
    rgba(255,255,255,.20);
}

.ring.go {
  animation:
    ringBlast
    1.1s
    ease-out;
}

@keyframes ringBlast {
  0% {
    opacity: 0;

    transform:
      translate(-50%,-50%)
      scale(.25);
  }

  18% {
    opacity: .9;
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%,-50%)
      scale(1.2);
  }
}


/* =========================================================
   PLAYER
========================================================= */

#player {
  position: absolute;

  z-index: 60;

  right:
    max(
      3vw,
      env(safe-area-inset-right)
    );

  bottom:
    max(
      4vh,
      env(safe-area-inset-bottom)
    );

  opacity: 0;

  pointer-events: none;

  transform:
    rotate(-6deg)
    translateY(12px);

  transform-origin:
    right bottom;

  transition:
    opacity .7s ease,
    transform .7s ease;
}

#player.show {
  opacity: 1;

  pointer-events: auto;

  transform:
    rotate(-6deg)
    translateY(0);
}


#playerHint {
  width: max-content;

  margin-left: auto;
  margin-bottom: 9px;

  padding:
    7px 12px;

  border-radius: 999px;

  border:
    1px solid
    rgba(255,255,255,.14);

  background:
    rgba(255,255,255,.05);

  backdrop-filter:
    blur(11px);

  font-family: var(--ui);

  font-size: 10px;

  letter-spacing: .05em;

  color:
    rgba(255,255,255,.63);

  box-shadow:
    0 10px 35px
    rgba(2,7,31,.12);

  transition:
    opacity .4s ease,
    transform .4s ease;
}


.turntable {
  position: relative;

  width: 170px;
  height: 134px;

  border-radius: 29px;

  border:
    1px solid
    rgba(255,255,255,.16);

  cursor: pointer;

  color: white;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.073),
      rgba(255,255,255,.012)
    );

  backdrop-filter:
    blur(11px)
    saturate(120%);

  box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.17),

    0 24px 64px
    rgba(2,7,32,.24),

    0 0 65px
    rgba(132,114,255,.07);

  transition:
    transform .25s ease;
}

.turntable:hover {
  transform:
    translateY(-4px)
    rotate(1deg);
}

.turntable:active {
  transform:
    scale(.97);
}


/* =========================================================
   VINYL
========================================================= */

.vinyl {
  position: absolute;

  left: 16px;
  top: 18px;

  width: 88px;
  height: 88px;

  overflow: hidden;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #12152c 0 13%,
      #1c2039 14% 25%,
      #070913 26% 100%
    );

  box-shadow:
    0 10px 24px
    rgba(0,0,0,.34),

    inset 0 0 0 1px
    rgba(255,255,255,.055);
}

.vinyl::before {
  content: "";

  position: absolute;
  inset: 0;

  border-radius: 50%;

  background:
    conic-gradient(
      from 23deg,
      transparent 0 11%,
      rgba(255,255,255,.09) 15%,
      transparent 23% 55%,
      rgba(255,255,255,.055) 62%,
      transparent 71%
    );
}

.vinyl.playing {
  animation:
    vinylSpin
    4.8s
    linear
    infinite;
}

@keyframes vinylSpin {
  to {
    transform:
      rotate(360deg);
  }
}


.groove {
  position: absolute;

  border-radius: 50%;

  border:
    1px solid
    rgba(255,255,255,.052);
}

.g1 { inset: 7px; }
.g2 { inset: 14px; }
.g3 { inset: 21px; }
.g4 { inset: 29px; }


.record-cover {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 38px;
  height: 38px;

  overflow: hidden;

  border-radius: 50%;

  transform:
    translate(-50%,-50%);

  border:
    1px solid
    rgba(255,255,255,.18);

  box-shadow:
    0 0 22px
    rgba(121,143,255,.32);
}

.record-cover img {
  width: 100%;

  常见简化骨架。

  星点相对位置来自实际 RA/Dec，
  连线本身只是用于视觉辨识。
*/

const virgoPaths = [

  [
    "mu",
    "iota",
    "alpha",
    "theta",
    "gamma",
    "eta",
    "beta"
  ],

  [
    "gamma",
    "delta",
    "zeta",
    "alpha"
  ],

  [
    "epsilon",
    "delta"
  ]

];


/* =========================================================
   RESIZE
========================================================= */

function resizeCanvas() {

  const rect =
    app.getBoundingClientRect();


  W =
    rect.width;

  H =
    rect.height;


  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  fxCanvas.width =
    Math.round(
      W * DPR
    );

  fxCanvas.height =
    Math.round(
      H * DPR
    );

  fxCanvas.style.width =
    W + "px";

  fxCanvas.style.height =
    H + "px";

  fx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  constellationCanvas.width =
    Math.round(
      W * DPR
    );

  constellationCanvas.height =
    Math.round(
      H * DPR
    );

  constellationCanvas.style.width =
    W + "px";

  constellationCanvas.style.height =
    H + "px";

  starCtx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  createUniverse();

}


/* =========================================================
   UNIVERSE
========================================================= */

function createUniverse() {

  const mobile =
    W < 700;


  const starCount =
    reducedMotion
      ? 0
      : mobile
        ? 82
        : 150;


  const dustCount =
    reducedMotion
      ? 0
      : mobile
        ? 110
        : 190;


  const cometCount =
    reducedMotion
      ? 0
      : mobile
        ? 7
        : 14;


  stars =
    Array.from(
      {
        length: starCount
      },

      () => ({

        x:
          Math.random() * W,

        y:
          Math.random() * H,

        r:
          .45 +
          Math.random() * 1.9,

        alpha:
          .14 +
          Math.random() * .62,

        phase:
          Math.random()
          *
          Math.PI
          *
          2,

        vx:
          (Math.random() - .5)
          *
          .075,

        vy:
          -.02 -
          Math.random()
          *
          .09

      })
    );


  dust =
    Array.from(
      {
        length: dustCount
      },

      () => ({

        x:
          Math.random() * W,

        y:
          Math.random() * H,

        r:
          .45 +
          Math.random() * 2.3,

        alpha:
          .025 +
          Math.random() * .14,

        vx:
          (Math.random() - .5)
          *
          .055,

        vy:
          (Math.random() - .5)
          *
          .055,

        color:
          Math.random() > .5
            ? "#73d8ff"
            : "#ae83ff"

      })
    );


  comets =
    Array.from(
      {
        length: cometCount
      },

      () => ({

        x:
          Math.random() * W,

        y:
          Math.random() * H,

        len:
          45 +
          Math.random() * 100,

        angle:
          -.95 +
          Math.random() * .45,

        speed:
          .07 +
          Math.random() * .14,

        alpha:
          .035 +
          Math.random() * .11

      })
    );

}


/* =========================================================
   PARTICLE EXPLOSION
========================================================= */

function explode(
  x,
  y,
  giant = false
) {

  if (reducedMotion) {
    return;
  }


  const mobile =
    W < 700;


  const count =
    giant
      ? (
          mobile
            ? 190
            : 300
        )
      : (
          mobile
            ? 90
            : 145
        );


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const angle =
      Math.random()
      *
      Math.PI
      *
      2;


    const speed =
      (giant ? 1.3 : .75)
      +
      Math.random()
      *
      (giant ? 7.1 : 4.8);


    bursts.push({

      x,
      y,

      vx:
        Math.cos(angle)
        *
        speed,

      vy:
        Math.sin(angle)
        *
        speed,

      life: 1,

      decay:
        .008 +
        Math.random()
        *
        .018,

      size:
        .7 +
        Math.random()
        *
        (giant ? 4.2 : 3),

      color:
        Math.random() < .27
          ? "#ffffff"

          : Math.random() < .52
            ? "#77dfff"
            : "#b18aff",

      type:
        Math.random() > .74
          ? "spark"
          : "dot"

    });

  }

}


/* =========================================================
   FINAL COLLAPSE
========================================================= */

function collapseUniverse() {

  if (reducedMotion) {
    return;
  }


  const centerX =
    W / 2;

  const centerY =
    H / 2;


  const count =
    W < 700
      ? 150
      : 240;


  collapseParticles = [];


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const side =
      Math.floor(
        Math.random() * 4
      );


    let x;
    let y;


    if (side === 0) {

      x =
        Math.random() * W;

      y =
        -20;

    } else if (side === 1) {

      x =
        W + 20;

      y =
        Math.random() * H;

    } else if (side === 2) {

      x =
        Math.random() * W;

      y =
        H + 20;

    } else {

      x =
        -20;

      y =
        Math.random() * H;

    }


    collapseParticles.push({

      x,
      y,

      tx:
        centerX +
        (Math.random() - .5)
        *
        35,

      ty:
        centerY +
        (Math.random() - .5)
        *
        35,

      life: 1,

      size:
        .8 +
        Math.random()
        *
        2.8,

      color:
        Math.random() > .5
          ? "#82deff"
          : "#b78cff"

    });

  }

}


/* =========================================================
   DRAW FX
========================================================= */

function drawFX() {

  fx.clearRect(
    0,
    0,
    W,
    H
  );


  const t =
    performance.now()
    /
    1000;


  /* floating dust */

  for (const p of dust) {

    p.x +=
      p.vx;

    p.y +=
      p.vy;


    if (p.x < -10) {
      p.x =
        W + 10;
    }

    if (p.x > W + 10) {
      p.x =
        -10;
    }

    if (p.y < -10) {
      p.y =
        H + 10;
    }

    if (p.y > H + 10) {
      p.y =
        -10;
    }


    fx.globalAlpha =
      p.alpha;

    fx.fillStyle =
      p.color;

    fx.beginPath();

    fx.arc(
      p.x,
      p.y,
      p.r,
      0,
      Math.PI * 2
    );

    fx.fill();

  }


  /* stars */

  for (const s of stars) {

    s.x +=
      s.vx;

    s.y +=
      s.vy;


    if (s.y < -8) {

      s.y =
        H + 8;

      s.x =
        Math.random()
        *
        W;

    }


    const blink =
      .50
      +
      .50
      *
      Math.sin(
        t * 1.55
        +
        s.phase
      );


    fx.globalAlpha =
      s.alpha
      *
      blink;


    fx.fillStyle =
      "#fff";


    fx.beginPath();

    fx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI * 2
    );

    fx.fill();

  }


  /* comets */

  for (const c of comets) {

    c.x +=
      Math.cos(
        c.angle
      )
      *
      c.speed;


    c.y +=
      Math.sin(
        c.angle
      )
      *
      c.speed;


    if (
      c.x > W + 120
      ||
      c.y < -120
    ) {

      c.x =
        -100;

      c.y =
        H
        +
        Math.random()
        *
        180;

    }


    const gradient =
      fx.createLinearGradient(
        c.x,
        c.y,

        c.x + c.len,
        c.y - c.len * .55
      );


    gradient.addColorStop(
      0,
      "rgba(255,255,255,0)"
    );


    gradient.addColorStop(
      .48,
      "rgba(255,255,255,.86)"
    );


    gradient.addColorStop(
      1,
      "rgba(255,255,255,0)"
    );


    fx.globalAlpha =
      c.alpha;


    fx.strokeStyle =
      gradient;


    fx.lineWidth =
      1.1;


    fx.beginPath();


    fx.moveTo(
      c.x,
      c.y
    );


    fx.lineTo(
      c.x + c.len,
      c.y - c.len * .55
    );


    fx.stroke();

  }


  /* explosion */

  bursts =
    bursts.filter(
      p =>
        p.life > 0
    );


  for (const p of bursts) {

    p.x +=
      p.vx;

    p.y +=
      p.vy;


    p.vx *=
      .979;

    p.vy *=
      .979;


    p.life -=
      p.decay;


    fx.globalAlpha =
      Math.max(
        0,
        p.life
      );


    if (p.type === "spark") {

      fx.strokeStyle =
        p.color;


      fx.lineWidth =
        1.2;


      fx.beginPath();


      fx.moveTo(
        p.x -
        p.vx * 4,

        p.y -
        p.vy * 4
      );


      fx.lineTo(
        p.x,
        p.y
      );


      fx.stroke();

    } else {

      fx.fillStyle =
        p.color;


      fx.beginPath();


      fx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI * 2
      );


      fx.fill();

    }

  }


  /* final collapse */

  collapseParticles =
    collapseParticles.filter(
      p =>
        p.life > .02
    );


  for (const p of collapseParticles) {

    p.x +=
      (
        p.tx -
        p.x
      )
      *
      .055;


    p.y +=
      (
        p.ty -
        p.y
      )
      *
      .055;


    p.life *=
      .982;


    fx.globalAlpha =
      p.life;


    fx.fillStyle =
      p.color;


    fx.beginPath();


    fx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );


    fx.fill();

  }


  fx.globalAlpha =
    1;


  requestAnimationFrame(
    drawFX
  );

}


/* =========================================================
   VIRGO REAL PROJECTION

   1h RA = 15°
   北朝上
   东朝左

   只做等比缩放和平移，
   不人为旋转星图。
========================================================= */

function projectVirgo(
  anchorRect
) {

  const appRect =
    app.getBoundingClientRect();


  const boxX =
    anchorRect.left -
    appRect.left;


  const boxY =
    anchorRect.top -
    appRect.top;


  const boxW =
    anchorRect.width;


  const boxH =
    anchorRect.height;


  const source =
    Object.entries(
      virgoStars
    )
    .map(
      ([key,star]) => ({
        key,

        ra:
          star.ra * 15,

        dec:
          star.dec,

        mag:
          star.mag
      })
    );


  const centerRA =
    source.reduce(
      (sum,s) =>
        sum + s.ra,
      0
    )
    /
    source.length;


  const centerDec =
    source.reduce(
      (sum,s) =>
        sum + s.dec,
      0
    )
    /
    source.length;


  const cosDec =
    Math.cos(
      centerDec
      *
      Math.PI
      /
      180
    );


  const projected =
    source.map(
      star => ({

        key:
          star.key,

        mag:
          star.mag,

        /*
          east left
        */

        x:
          -(
            star.ra -
            centerRA
          )
          *
          cosDec,

        /*
          north up
        */

        y:
          -(
            star.dec -
            centerDec
          )

      })
    );


  const xs =
    projected.map(
      p => p.x
    );


  const ys =
    projected.map(
      p => p.y
    );


  const minX =
    Math.min(
      ...xs
    );

  const maxX =
    Math.max(
      ...xs
    );

  const minY =
    Math.min(
      ...ys
    );

  const maxY =
    Math.max(
      ...ys
    );


  const rawW =
    maxX -
    minX;

  const rawH =
    maxY -
    minY;


  const mobile =
    W < 700;


  const paddingX =
    boxW
    *
    (
      mobile
        ? .11
        : .13
    );


  const paddingY =
    boxH
    *
    (
      mobile
        ? .13
        : .14
    );


  const usableW =
    boxW -
    paddingX * 2;


  const usableH =
    boxH -
    paddingY * 2;


  const scale =
    Math.min(
      usableW / rawW,
      usableH / rawH
    );


  const drawW =
    rawW
    *
    scale;


  const drawH =
    rawH
    *
    scale;


  /*
    只是轻微整体平移，
    不改变星座形状。
  */

  const horizontalShift =
    mobile
      ? -boxW * .025
      : -boxW * .045;


  const verticalShift =
    mobile
      ? 0
      : boxH * .01;


  const startX =
    boxX
    +
    (
      boxW -
      drawW
    )
    /
    2
    +
    horizontalShift;


  const startY =
    boxY
    +
    (
      boxH -
      drawH
    )
    /
    2
    +
    verticalShift;


  const result = {};


  projected.forEach(
    p => {

      result[p.key] = {

        x:
          startX
          +
          (
            p.x -
            minX
          )
          *
          scale,

        y:
          startY
          +
          (
            p.y -
            minY
          )
          *
          scale,

        mag:
          p.mag

      };

    }
  );


  return result;

}


/* =========================================================
   DRAW VIRGO
========================================================= */

function drawConstellation() {

  starCtx.clearRect(
    0,
    0,
    W,
    H
  );


  constellationOpacity +=
    (
      constellationTargetOpacity -
      constellationOpacity
    )
    *
    .03;


  /*
    普通页面绑定正文玻璃。
    最后一页绑定 finalGlass。
  */

  let anchorRect;


  if (
    finaleStarted &&
    finalGlass
  ) {

    anchorRect =
      finalGlass
      .getBoundingClientRect();

  } else {

    anchorRect =
      card
      .getBoundingClientRect();

  }


  if (
    anchorRect.width <= 1 ||
    anchorRect.height <= 1
  ) {

    requestAnimationFrame(
      drawConstellation
    );

    return;

  }


  const points =
    projectVirgo(
      anchorRect
    );


  const time =
    performance.now()
    /
    1000;


  const mobile =
    W < 700;


  starCtx.save();


  starCtx.globalAlpha =
    constellationOpacity;


  /* -------------------------------------------------------
     连线
  ------------------------------------------------------- */

  for (
    const path
    of virgoPaths
  ) {

    for (
      let i = 0;
      i < path.length - 1;
      i++
    ) {

      const p1 =
        points[
          path[i]
        ];


      const p2 =
        points[
          path[i + 1]
        ];


      if (
        !p1 ||
        !p2
      ) {
        continue;
      }


      const gradient =
        starCtx
        .createLinearGradient(
          p1.x,
          p1.y,
          p2.x,
          p2.y
        );


      gradient.addColorStop(
        0,
        "rgba(106,203,255,.10)"
      );


      gradient.addColorStop(
        .48,
        "rgba(203,185,255,.54)"
      );


      gradient.addColorStop(
        1,
        "rgba(112,218,255,.10)"
      );


      starCtx.strokeStyle =
        gradient;


      starCtx.lineWidth =
        mobile
          ? .85
          : 1;


      starCtx.shadowBlur =
        12;


      starCtx.shadowColor =
        "rgba(151,171,255,.48)";


      starCtx.beginPath();


      starCtx.moveTo(
        p1.x,
        p1.y
      );


      starCtx.lineTo(
        p2.x,
        p2.y
      );


      starCtx.stroke();

    }

  }


  /* -------------------------------------------------------
     星点
  ------------------------------------------------------- */

  Object.entries(
    points
  )
  .forEach(
    (
      [key,p],
      index
    ) => {


      const breathe =
        .72
        +
        Math.sin(
          time * 1.25
          +
          index * .73
        )
        *
        .22;


      const clickPulse =
        constellationPulse
        *
        (
          1
          +
          .20
          *
          Math.sin(
            index * 1.7
          )
        );


      /*
        星等越小越亮
      */

      const brightness =
        Math.max(
          0,
          5 -
          p.mag
        );


      const baseRadius =
        1.15
        +
        brightness
        *
        .62;


      const radius =
        baseRadius
        +
        clickPulse
        *
        1.15;


      const glowSize =
        10
        +
        brightness
        *
        4
        +
        clickPulse
        *
        18;


      const glow =
        starCtx
        .createRadialGradient(
          p.x,
          p.y,
          0,

          p.x,
          p.y,
          glowSize
        );


      glow.addColorStop(
        0,
        `rgba(
          255,
          255,
          255,
          ${.96 * breathe}
        )`
      );


      glow.addColorStop(
        .14,
        `rgba(
          170,
          205,
          255,
          ${.72 * breathe}
        )`
      );


      glow.addColorStop(
        .43,
        `rgba(
          164,
          129,
          255,
          ${.18 * breathe}
        )`
      );


      glow.addColorStop(
        1,
        "rgba(120,130,255,0)"
      );


      starCtx.fillStyle =
        glow;


      starCtx.beginPath();


      starCtx.arc(
        p.x,
        p.y,
        glowSize,
        0,
        Math.PI * 2
      );


      starCtx.fill();


      starCtx.shadowBlur =
        10
        +
        clickPulse
        *
        10;


      starCtx.shadowColor =
        "rgba(215,225,255,.85)";


      starCtx.fillStyle =
        "rgba(255,255,255,.97)";


      starCtx.beginPath();


      starCtx.arc(
        p.x,
        p.y,
        radius,
        0,
        Math.PI * 2
      );


      starCtx.fill();


      /*
        Spica 是 Virgo 最亮星。
      */

      if (
        key === "alpha"
      ) {

        starCtx.shadowBlur =
          28;


        starCtx.shadowColor =
          "rgba(185,205,255,.90)";


        starCtx.strokeStyle =
          "rgba(255,255,255,.50)";


        starCtx.lineWidth =
          .75;


        starCtx.beginPath();


        starCtx.arc(
          p.x,
          p.y,
          radius + 5,
          0,
          Math.PI * 2
        );


        starCtx.stroke();

      }

    }
  );


  /* -------------------------------------------------------
     VIRGO LABEL
  ------------------------------------------------------- */

  const spica =
    points.alpha;


  if (spica) {

    starCtx.shadowBlur =
      0;


    starCtx.globalAlpha =
      constellationOpacity
      *
      .32;


    starCtx.font =
      mobile
        ? "9px -apple-system, BlinkMacSystemFont, sans-serif"
        : "10px -apple-system, BlinkMacSystemFont, sans-serif";


    starCtx.fillStyle =
      "rgba(225,231,255,.76)";


    starCtx.fillText(
      "V I R G O",

      spica.x + 18,

      spica.y + 27
    );

  }


  starCtx.restore();


  constellationPulse *=
    .92;


  requestAnimationFrame(
    drawConstellation
  );

}

function flashAt(
  x,
  y
) {

  flash.style.setProperty(
    "--flash-x",
    `${x / W * 100}%`
  );


  flash.style.setProperty(
    "--flash-y",
    `${y / H * 100}%`
  );


  flash.classList.remove(
    "boom"
  );


  void flash.offsetWidth;


  flash.classList.add(
    "boom"
  );

}


function ringBlast() {

  [
    ring1,
    ring2,
    ring3
  ]
  .forEach(
    ring =>
      ring.classList.remove(
        "go"
      )
  );


  void ring1.offsetWidth;


  ring1.classList.add(
    "go"
  );


  setTimeout(
    () => {

      ring2.classList.add(
        "go"
      );

    },
    70
  );


  setTimeout(
    () => {

      ring3.classList.add(
        "go"
      );

    },
    145
  );

}


function glassWave(
  clientX,
  clientY
) {

  const rect =
    card.getBoundingClientRect();


  const x =
    clientX -
    rect.left;


  const y =
    clientY -
    rect.top;


  ripple.style.left =
    x + "px";


  ripple.style.top =
    y + "px";


  ripple.classList.remove(
    "go"
  );


  void ripple.offsetWidth;


  ripple.classList.add(
    "go"
  );

}

   SLIDES
========================================================= */

function renderSlide(
  index
) {

  const slide =
    slides[index];


  card.dataset.mode =
    slide.mode;


  eyebrow.textContent =
    slide.tag;


  storyText.innerHTML =
    slide.lines
      .map(
        (
          line,
          i
        ) =>

          `
          <span
            class="story-line"
            style="--i:${i}"
          >
            ${line}
          </span>
          `
      )
      .join("");


  if (
    index ===
    slides.length - 1
  ) {

    hint.textContent =
      "最后一次";

  } else {

    hint.textContent =
      "轻触这封信，继续";

  }

}


/* =========================================================
   NEXT
========================================================= */

function goNext(
  event
) {

  if (
    !started ||
    transitioning ||
    finaleStarted
  ) {

    return;

  }


  const appRect =
    app.getBoundingClientRect();


  const x =
    event.clientX -
    appRect.left;


  const y =
    event.clientY -
    appRect.top;


  explode(
    x,
    y,
    false
  );


  flashAt(
    x,
    y
  );


  glassWave(
    event.clientX,
    event.clientY
  );


  ringBlast();


  constellationPulse =
    1.25;


  if (
    currentSlide ===
    slides.length - 1
  ) {

    startFinale();

    return;

  }


  transitioning =
    true;


  card.classList.add(
    "leaving"
  );


  eyebrow.style.opacity =
    "0";


  setTimeout(
    () => {

      currentSlide++;


      renderSlide(
        currentSlide
      );


      card.classList.remove(
        "leaving"
      );


      eyebrow.style.opacity =
        "1";


      setTimeout(
        () => {

          transitioning =
            false;

        },
        650
      );

    },
    390
  );

}


card.addEventListener(
  "pointerdown",
  goNext
);


/* =========================================================
   OPEN ENVELOPE
========================================================= */

envelope.addEventListener(
  "click",
  () => {

    if (started) {
      return;
    }


    started =
      true;


    envelope.classList.add(
      "open"
    );


    const er =
      envelope.getBoundingClientRect();


    const ar =
      app.getBoundingClientRect();


    const x =
      er.left +
      er.width / 2 -
      ar.left;


    const y =
      er.top +
      er.height / 2 -
      ar.top;


    setTimeout(
      () => {

        explode(
          x,
          y,
          true
        );


        flashAt(
          x,
          y
        );


        constellationPulse =
          2.8;

      },
      180
    );


    setTimeout(
      () => {

        intro.classList.add(
          "leave"
        );

      },
      490
    );


    setTimeout(
      () => {

        intro.style.display =
          "none";


        story.classList.add(
          "show"
        );


        player.classList.add(
          "show"
        );


        renderSlide(
          0
        );

      },
      1220
    );

  }
);


/* =========================================================
   MUSIC
========================================================= */

function setMusicState(
  playing
) {

  vinyl.classList.toggle(
    "playing",
    playing
  );


  tonearm.classList.toggle(
    "playing",
    playing
  );


  musicState.textContent =
    playing
      ? "PAUSE"
      : "PLAY";


  musicButton.setAttribute(
    "aria-label",

    playing
      ? "暂停音乐"
      : "播放音乐"
  );


  if (playing) {

    playerHint.style.opacity =
      "0";


    playerHint.style.transform =
      "translateY(7px)";


    setTimeout(
      () => {

        playerHint.style.visibility =
          "hidden";

      },
      450
    );

  }

}


musicButton.addEventListener(
  "click",
  async event => {

    event.stopPropagation();


    if (music.paused) {

      try {

        await music.play();


        setMusicState(
          true
        );

      } catch (error) {

        playerHint.style.visibility =
          "visible";


        playerHint.style.opacity =
          "1";


        playerHint.style.transform =
          "none";


        playerHint.textContent =
          "没有找到 music.mp3";

      }

    } else {

      music.pause();


      setMusicState(
        false
      );

    }

  }
);


music.addEventListener(
  "play",
  () => {

    setMusicState(
      true
    );

  }
);


music.addEventListener(
  "pause",
  () => {

    setMusicState(
      false
    );

  }
);


/* =========================================================
   FINAL
========================================================= */

function wait(
  ms
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


async function startFinale() {

  if (finaleStarted) {
    return;
  }


  finaleStarted =
    true;


  hint.style.opacity =
    "0";


  /*
    最后一页先安静下来。
  */

  constellationTargetOpacity =
    .16;


  collapseUniverse();


  const cx =
    W / 2;


  const cy =
    H / 2;


  explode(
    cx,
    cy,
    true
  );


  flashAt(
    cx,
    cy
  );


  card.classList.add(
    "shatter"
  );


  await wait(
    650
  );


  story.style.opacity =
    "0";


  story.style.pointerEvents =
    "none";


  finalScene.classList.add(
    "show"
  );


  await wait(
    180
  );


  finalGlass.classList.add(
    "show"
  );


  await wait(
    650
  );


  /* 巨大的 23 */

  giant23.classList.add(
    "show"
  );


  await wait(
    1750
  );


  giant23.classList.add(
    "leave"
  );


  explode(
    cx,
    cy,
    true
  );


  constellationPulse =
    2.2;


  await wait(
    780
  );


  giant23.style.display =
    "none";


  /* 愿23岁的你 */

  finalLead.classList.add(
    "show"
  );


  await wait(
    850
  );


  /* 自由 / 勇敢 / 开心 / 被爱 */

  for (
    let i = 0;
    i < finalWordEls.length;
    i++
  ) {

    const word =
      finalWordEls[i];


    word.classList.add(
      "show"
    );


    constellationPulse =
      1.15;


    explode(

      cx +
      (
        Math.random() -
        .5
      ) *
      50,

      cy +
      (
        Math.random() -
        .5
      ) *
      35,

      false

    );


    await wait(
      1000
    );


    word.classList.add(
      "hide"
    );


    await wait(
      500
    );

  }


  finalLead.style.opacity =
    "0";


  await wait(
    700
  );


  finalWordEls.forEach(
    word => {

      word.style.display =
        "none";

    }
  );


  /*
    最后一段不再炸。
    就停在这里。
  */

  finalMessage.classList.add(
    "show"
  );


  constellationTargetOpacity =
    .28;


  constellationPulse =
    .75;

}


/* =========================================================
   INIT
========================================================= */

resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


renderSlide(
  0
);


drawFX();


drawConstellation();


})();

</script>
